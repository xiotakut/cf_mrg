<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ed">
  <meta name="description" content="一只鹈鹕、一辆单车，还有一整天的海风。可交互的原创 SVG 骑行动画。">
  <title>海风骑行 · Pelican Cycling Club</title>
  <style>
    :root { color-scheme: light; --paper:#f6f4ed; --ink:#243e3a; --muted:#6a7b72; --coral:#d66745; --line:#d9dfd2; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif; }
    button,input { font:inherit; }
    button { color:inherit; cursor:pointer; }
    button:focus-visible,input:focus-visible { outline:3px solid var(--coral); outline-offset:5px; }
    .page { max-width:1248px; margin:auto; padding:30px 42px 24px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; padding-bottom:25px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand-mark { width:39px; height:39px; }
    .brand-name { font-size:12px; line-height:1.5; font-weight:700; letter-spacing:2.5px; }
    .edition { font:10px/1.5 monospace; letter-spacing:1.7px; color:var(--muted); }
    .intro { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; padding:36px 0 26px; }
    .eyebrow { margin:0 0 12px; font-size:10px; letter-spacing:2.8px; color:var(--coral); font-weight:700; }
    h1 { margin:0; font-size:clamp(28px,3.8vw,46px); font-weight:600; letter-spacing:-1.7px; line-height:1.3; }
    h1 span { color:var(--coral); }
    .intro p:last-child { margin:0 0 3px; color:var(--muted); font-size:12px; line-height:1.9; letter-spacing:.5px; }
    .stage { position:relative; border-radius:12px; overflow:hidden; background:#e5eee4; }
    .scene { display:block; width:100%; height:auto; }
    .scene-label { position:absolute; left:28px; top:25px; display:flex; align-items:center; gap:8px; font-size:10px; letter-spacing:1.5px; color:#406963; }
    .dot { width:6px; height:6px; border-radius:50%; background:#567c62; }
    .postmark { position:absolute; right:25px; top:24px; font:10px monospace; letter-spacing:1.6px; color:#527870; }
    .controls { display:flex; justify-content:space-between; align-items:center; gap:24px; padding:23px 0; border-bottom:1px solid var(--line); }
    .transport { display:flex; gap:16px; align-items:center; }
    .play { display:flex; align-items:center; justify-content:center; gap:9px; border:0; background:var(--ink); color:var(--paper); padding:13px 21px; border-radius:7px; min-width:124px; font-size:12px; transition:background .15s; }
    .play:hover { background:#395a50; }
    .play svg { width:14px; height:14px; }
    .status { color:var(--muted); font-size:11px; }
    .pace { display:flex; align-items:center; gap:13px; font-size:11px; }
    .pace label { color:var(--muted); }
    input[type=range] { width:135px; height:18px; accent-color:var(--ink); cursor:pointer; }
    output { min-width:38px; font:11px monospace; }
    footer { display:flex; justify-content:space-between; gap:20px; padding-top:19px; color:var(--muted); font-size:10px; letter-spacing:.6px; }
    footer span:last-child { font:10px monospace; letter-spacing:1.3px; }
    noscript p { color:var(--coral); font-size:12px; }
    @media(max-width:640px) {
      .page { padding:22px 20px; }
      header { padding-bottom:19px; }
      .edition { font-size:8px; letter-spacing:.8px; }
      .intro { display:block; padding:29px 0 22px; }
      .intro p:last-child { margin-top:13px; font-size:11px; }
      h1 { letter-spacing:-.8px; }
      .stage { margin:0 -8px; }
      .scene { width:150%; max-width:none; margin-left:-25%; }
      .scene-label { top:14px; left:14px; font-size:8px; }
      .postmark { top:14px; right:14px; font-size:8px; }
      .controls { flex-wrap:wrap; gap:21px; padding:21px 0; }
      .transport { width:100%; justify-content:space-between; }
      .pace { width:100%; }
      input[type=range] { flex:1; width:auto; }
      footer { font-size:9px; }
      footer span:last-child { font-size:8px; }
    }
  </style>
</head>
<body>
<main class="page">
  <header>
    <div class="brand">

</main>
<script>
(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const nodes = Object.fromEntries(['rear-spokes','front-spokes','crank','pedal-back','pedal-front','leg-back','leg-front','leg-highlight','foot-back','foot-front','rider','eye','scarf-tail','clouds','gulls','sea-lines','road-marks','distant-grass','foreground','breeze','shadow'].map(id => [id, byId(id)]));
  const play = byId('play');
  const speed = byId('speed');
  const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
  let running = !motionPreference.matches;
  let time = 0;
  let previous = null;
  let request = null;
  let pace = Number(speed.value);
  const transform = (id, value) => nodes[id].setAttribute('transform', value);

  // Two-segment inverse kinematics keeps each foot attached to its pedal.
  function leg(hip, foot, upper, lower, bend) {
    const dx = foot.x - hip.x, dy = foot.y - hip.y;
    const distance = Math.hypot(dx, dy);
    const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
    const height = Math.sqrt(Math.max(0, upper * upper - along * along));
    const knee = { x:hip.x + along * dx / distance + bend * height * dy / distance,
                   y:hip.y + along * dy / distance - bend * height * dx / distance };
    return `M${hip.x} ${hip.y} ${knee.x} ${knee.y} ${foot.x} ${foot.y}`;
  }

  function draw() {
    const phase = time * 2.6;
    const bob = Math.sin(phase * 2) * 2;
    const distance = phase * 94 * 1.35;
    const rotation = phase * 180 / Math.PI;
    const front = { x:594 + Math.cos(phase) * 38, y:453 + Math.sin(phase) * 38 };
    const back = { x:594 - Math.cos(phase) * 38, y:453 - Math.sin(phase) * 38 };
    transform('rear-spokes', `rotate(${rotation * 1.35})`);
    transform('front-spokes', `rotate(${rotation * 1.35})`);
    transform('crank', `rotate(${rotation} 594 453)`);
    transform('rider', `translate(0 ${bob})`);
    nodes['pedal-front'].setAttribute('d', `M${front.x - 14} ${front.y + 3}h28`);
    nodes['pedal-back'].setAttribute('d', `M${back.x - 14} ${back.y + 3}h28`);
    const frontPath = leg({x:555,y:321 + bob}, {x:front.x,y:front.y - 5}, 89, 94, -1);
    nodes['leg-front'].setAttribute('d', frontPath);
    nodes['leg-highlight'].setAttribute('d', frontPath);
    nodes['leg-back'].setAttribute('d', leg({x:564,y:320 + bob}, {x:back.x,y:back.y - 5}, 90, 96, -1));
    nodes['foot-front'].setAttribute('d', `M${front.x - 16} ${front.y - 3}q5-12 16-7l20 8q-16 5-36-1Z`);
    nodes['foot-back'].setAttribute('d', `M${back.x - 14} ${back.y - 3}q14-8 31 0`);
    transform('clouds', `translate(${-((time * 8) % 1300)} 0)`);
    transform('gulls', `translate(0 ${Math.sin(time * 1.2) * 3})`);
    nodes['sea-lines'].setAttribute('patternTransform', `translate(${-((time * 15) % 360)} 0)`);
    nodes['road-marks'].setAttribute('patternTransform', `translate(${-(distance % 260)} 0)`);
    transform('distant-grass', `translate(${-(distance * .35 % 1200)} 0)`);
    transform('foreground', `translate(${-(distance % 1200)} 0)`);
    const flutter = Math.sin(time * 8) * 5;
    nodes['scarf-tail'].setAttribute('d', `M625 211C595 ${210+flutter} 570 ${189-flutter} 548 ${196+flutter}L525 ${211+flutter} 547 ${211+flutter} 540 ${224+flutter}C579 ${208-flutter} 594 ${235+flutter} 621 222Z`);
    const blink = time % 4.8;
    transform('eye', `translate(689 146) scale(1 ${blink > 4.63 ? .12 : 1}) translate(-689 -146)`);
    nodes.breeze.setAttribute('opacity', .45 + Math.sin(time * 3) * .25);
    nodes.shadow.setAttribute('rx', 230 + bob * 1.5);
  }

  function frame(now) {
    request = null;
    if (!running || document.hidden) { previous = null; return; }
    if (previous !== null) time += Math.min((now - previous) / 1000, .05) * pace;
    previous = now;
    draw();
    request = requestAnimationFrame(frame);
  }

  function schedule() {
    if (request !== null) cancelAnimationFrame(request);
    request = null;
    previous = null;
    if (running && !document.hidden) request = requestAnimationFrame(frame);
  }

  function updateControl() {
    play.setAttribute('aria-label', running ? '暂停动画' : '播放动画');
    byId('play-label').textContent = running ? '歇一小会' : '继续骑行';
    byId('status').textContent = running ? '正在享受海风' : '停下来，看看海';
    byId('play-icon').setAttribute('d', running ? 'M3 2h3v12H3zM10 2h3v12h-3z' : 'M4 2 14 8 4 14Z');
  }

  play.addEventListener('click', () => { running = !running; updateControl(); schedule(); });
  speed.addEventListener('input', () => {
    pace = Number(speed.value);
    byId('speed-value').value = `${pace.toFixed(2)}×`;
    speed.setAttribute('aria-valuetext', `${pace} 倍速度`);
  });
  document.addEventListener('visibilitychange', schedule);
  motionPreference.addEventListener('change', event => {
    if (event.matches) { running = false; updateControl(); schedule(); }
  });
  draw();
  updateControl();
  schedule();
})();
</script>
</body>
</html>
